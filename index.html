<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWILL Scanner - Online</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header {
            border: 2px solid #00ff41;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5em;
            text-shadow: 0 0 20px #00ff41;
        }
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            min-width: 300px;
            background: #000;
            border: 2px solid #00ff41;
            color: #00ff41;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            border-radius: 10px;
            outline: none;
        }
        button {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        button:hover {
            background: #00cc33;
            box-shadow: 0 0 20px #00ff41;
        }
        .output {
            background: #000;
            border: 2px solid #00ff41;
            border-radius: 15px;
            padding: 20px;
            min-height: 300px;
            white-space: pre-wrap;
            font-size: 14px;
        }
        .info-box {
            background: #111827;
            border: 2px solid #00ccff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ SWILL Scanner ⚡</h1>
            <p>Online Security Scanner</p>
        </header>
        
        <div class="info-box">
            <p>🔗 Сканер работает через GitHub Actions</p>
            <p>📊 Результаты сохраняются в artifacts</p>
            <p>🔄 Автоматический запуск каждый день</p>
        </div>
        
        <div class="input-group">
            <input type="text" id="target" placeholder="Введите URL (например: https://example.com)">
            <button onclick="openWorkflow()">Сканировать</button>
        </div>
        
        <div class="output" id="output">
[SWILL] Введите URL и нажмите "Сканировать"
[SWILL] Откроется GitHub Actions для запуска
        </div>
    </div>
    
    <script>
        function openWorkflow() {
            const target = document.getElementById('target').value;
            if (!target) {
                alert('Введите URL');
                return;
            }
            
            const repo = 'ВАШ_ЛОГИН/ВАШ_РЕПОЗИТОРИЙ';
            const workflowUrl = `https://github.com/${repo}/actions/workflows/scanner.yml`;
            
            document.getElementById('output').innerHTML = `
[SWILL] Цель: ${target}
[SWILL] Открываю GitHub Actions...
[SWILL] URL: ${workflowUrl}
[SWILL] Нажмите "Run workflow" и введите URL
            `;
            
            window.open(workflowUrl, '_blank');
        }
    </script>
</body>
</html>
